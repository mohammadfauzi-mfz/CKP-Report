name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - name: Unit test (tidak menggagalkan build APK)
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laporan-test
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: CKPReport-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publikasikan rilis (dipakai fitur pembaruan di aplikasi)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "CKPReport-$VER.apk"
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "CKPReport-$VER.apk" --clobber
          else
            gh release create "v$VER" "CKPReport-$VER.apk" --title "CKP Report $VER" --notes "CKP Report versi $VER" --latest
          fi
